<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Player</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@property --lf{syntax:'<length>';inherits:false;initial-value:0px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#9fb4cf;font-family:Inter,-apple-system,"SF Pro Text",Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff}
#bg{position:fixed;inset:-15%;background:center/cover;filter:blur(38px) saturate(1.15);transform:scale(1.3)}
#veil{position:fixed;inset:0;background:linear-gradient(180deg,rgba(238,238,241,.93),rgba(238,238,241,0) 30%,rgba(25,45,85,0) 58%,rgba(22,40,78,.5))}
#stage{position:absolute;left:50%;top:50%;width:670px;height:1280px;transform-origin:50% 50%}
#card{position:absolute;left:38px;top:155px;width:595px;height:970px;border-radius:82px;
 background:linear-gradient(180deg,rgba(132,139,153,.9),rgba(120,128,144,.9));
 backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
 box-shadow:inset 0 0 0 2px rgba(255,255,255,.14),inset 0 4px 10px rgba(255,236,214,.35),0 10px 40px rgba(20,40,80,.18)}
#card>*{position:absolute}
#art{left:40px;top:38px;width:516px;height:519px;border-radius:38px 38px 30px 30px;overflow:hidden;cursor:pointer;background:#9bb}
#art img{width:100%;height:100%;object-fit:cover;display:block}
.sub{left:40px;font-size:20px;line-height:24px;color:rgba(255,255,255,.7);font-weight:400;white-space:nowrap}
#dev{top:573px}
#artist{top:637px;font-size:22px;line-height:26px;max-width:440px;overflow:hidden;text-overflow:ellipsis}
#mqw{left:40px;top:601px;width:440px;height:30px;overflow:hidden}
#mq{display:flex;gap:70px;width:max-content;font-size:21px;line-height:30px;font-weight:600;letter-spacing:.1px;white-space:nowrap}
#t2{display:none}
#mqw.scroll{--lf:0px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--lf),#000 calc(100% - 30px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 var(--lf),#000 calc(100% - 30px),transparent 100%);animation:mqf var(--s) linear infinite}
#mqw.scroll #t2{display:block}
#mqw.scroll #mq{animation:mq var(--s) linear infinite}
@keyframes mq{0%,12%{transform:translateX(0)}100%{transform:translateX(calc(var(--d) * -1))}}
@keyframes mqf{0%,12%{--lf:0px}18%,94%{--lf:30px}100%{--lf:0px}}
#air{left:507px;top:605px;width:34px;height:34px;opacity:.95}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.34)}
#pb{left:40px;top:703px;width:516px;touch-action:none}
#pbh{left:40px;top:688px;width:516px;height:36px;touch-action:none;cursor:pointer}
#pbh .bar{position:absolute;left:0;right:0;top:15px}
#pf,#vf{display:block;height:100%;background:#fff;border-radius:3px;width:10%}
#tc,#tr{top:721px;font-size:18px;line-height:24px;font-weight:500;color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums}
#tc{left:42px}#tr{right:43px}
.cb{width:90px;height:90px;top:755px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s,opacity .12s}
.cb:active{transform:scale(.88);opacity:.7}
#prev{left:102px}#pp{left:253px}#next{left:404px}
#vh{left:116px;top:868px;width:353px;height:50px;touch-action:none;cursor:pointer}
#vh .bar{position:absolute;left:0;right:0;top:22px;height:5px}
#vk{position:absolute;top:4px;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);left:68.5%}
#vl{left:62px;top:878px;width:30px;height:30px;opacity:.88}
#vr{left:494px;top:877px;width:46px;height:32px;opacity:.88}
#gear{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));z-index:20;width:44px;height:44px;border-radius:50%;border:0;background:rgba(30,40,60,.55);color:#fff;font-size:20px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#panel{position:fixed;left:50%;bottom:0;z-index:30;width:min(440px,100%);transform:translate(-50%,105%);transition:transform .3s;background:rgba(24,30,44,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px 24px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;user-select:text;-webkit-user-select:text}
#panel.open{transform:translate(-50%,0)}
#panel h2{font-size:17px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
#panel h2 button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:12px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font:600 14px Inter,sans-serif;cursor:pointer;text-align:center}
.btn:active{background:rgba(255,255,255,.25)}
label{display:grid;gap:5px;font-size:13px;color:rgba(255,255,255,.65)}
input[type=text]{padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font:500 15px Inter,sans-serif;outline:none}
input[type=text]:focus{border-color:#9cc4ff}
input[type=file]{display:none}
#note{font-size:12px;color:rgba(255,255,255,.5)}
#bExp{background:#2f7cf6}#bExp:active{background:#1f67d8}
#expSt{font-size:12px;line-height:1.4;color:rgba(255,255,255,.7)}

/* Visual tuning to match the reference screenshot */
#bg{inset:-15%;background-color:#a3c0df;background-position:center 36%;background-size:100% auto;background-repeat:no-repeat;filter:blur(53px) saturate(1.07);transform:scale(1.05)}
#veil{background:radial-gradient(ellipse 300px 300px at 1% 101%,rgba(19,37,64,.70),transparent 75%),linear-gradient(180deg,rgba(220,216,211,.87) 0%,rgba(203,219,234,.12) 32%,rgba(145,177,214,.12) 61%,rgba(134,168,210,.77) 100%)}
#card{background:radial-gradient(ellipse 245px 190px at 50% 71%,rgba(7,13,25,.67) 0%,rgba(7,14,27,.56) 45%,rgba(16,28,45,0) 99%),linear-gradient(180deg,rgba(115,122,137,.73) 0%,rgba(87,102,117,.68) 51%,rgba(62,78,101,.65) 100%);backdrop-filter:blur(44px) saturate(1.08);-webkit-backdrop-filter:blur(44px) saturate(1.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 3px 10px rgba(255,236,214,.21),0 10px 35px rgba(36,52,78,.15)}
#gear{opacity:0;transition:opacity .2s}
#stage:hover ~ #gear,#gear:hover,#gear:focus-visible{opacity:1}
@media (hover:none){#gear{opacity:.38}}
</style>
</head>
<body>
<div id="bg"></div><div id="veil"></div>
<div id="stage"><div id="card">
 <div id="art" title="Tukar gambar album"><img id="artimg" alt="Album"></div>
 <div id="dev" class="sub">iPhone</div>
 <div id="mqw"><div id="mq"><span id="t1"></span><span id="t2"></span></div></div>

 <svg id="vl" viewBox="0 0 30 30" fill="#fff"><path d="M3 11h5l8-6.5v21L8 19H3z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
 <div id="vh"><div class="bar"><i id="vf" style="width:68.5%"></i></div><b id="vk"></b></div>
 <svg id="vr" viewBox="0 0 46 32" fill="#fff"><path d="M3 11h5l8-6.5v23L8 21H3z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M22 11.5a7 7 0 0 1 0 9"/><path d="M27 7.5a12.5 12.5 0 0 1 0 17"/><path d="M32 3.5a18 18 0 0 1 0 25"/></g></svg>
</div></div>

<button id="gear" aria-label="Tetapan">✎</button>

 <h2>Sesuaikan pemain <button id="x" aria-label="Tutup">×</button></h2>

 <label>Tajuk lagu<input type="text" id="iT"></label>
 <label>Artis<input type="text" id="iA"></label>

 <input type="file" id="imgIn" accept="image/*"><input type="file" id="songIn" accept="audio/*" multiple>
</div>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
let tracks=[],ti=-1,vol=.685;
const sim={cur:8,dur:77,play:true};
const meta={title:'TEREK BALE X KITA GAS NAPE TAMANG',artist:'ELART RMX'};
const au=new Audio();au.volume=vol;
const has=()=>ti>=0,M=()=>has()?tracks[ti]:meta;
const cur=()=>has()?au.currentTime:sim.cur;
const dur=()=>has()?(isFinite(au.duration)?au.duration:0):sim.dur;
const playing=()=>has()?!au.paused:sim.play;

const PAUSE='<svg width="40" height="57" viewBox="0 0 40 57" fill="#fff"><rect width="15" height="57" rx="3.5"/><rect x="25" width="15" height="57" rx="3.5"/></svg>';
const PLAY='<svg width="46" height="56" viewBox="0 0 46 56" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"><path d="M6 5 41 28 6 51Z"/></svg>';
let lastP=null;
function render(){
 const c=cur(),d=dur(),r=Math.max(0,d-c);
 $('tc').textContent=pad(Math.floor(c/60))+':'+pad(Math.floor(c%60));
 $('tr').textContent='-'+Math.floor(r/60)+':'+pad(Math.floor(r%60));
 $('pf').style.width=(d?Math.min(100,c/d*100):0)+'%';
 const p=playing();if(p!==lastP){lastP=p;$('pp').innerHTML=p?PAUSE:PLAY}
}
function fit(){
 const w=$('mqw'),t=M().title;
 $('t1').textContent=$('t2').textContent=t;w.classList.remove('scroll');
 const tw=$('t1').offsetWidth;
 if(tw>440){const d=tw+70;w.style.setProperty('--d',d+'px');w.style.setProperty('--s',(d/42+2)+'s');w.classList.add('scroll')}
}
function setText(){fit();$('artist').textContent=M().artist;$('dev').textContent=$('iD').value||'iPhone'}
function syncInputs(){$('iT').value=M().title;$('iA').value=M().artist}
function setArt(src){$('artimg').src=src;$('bg').style.backgroundImage='url("'+src+'")'}
function load(i){ti=i;au.src=tracks[i].url;au.play().catch(()=>{});syncInputs();setText();render()}
function seekTo(t){if(has())au.currentTime=t;else sim.cur=t;render()}
function next(){if(tracks.length>1)load((ti+1)%tracks.length);else seekTo(0)}
function prev(){if(cur()>3||tracks.length<2)seekTo(0);else load((ti-1+tracks.length)%tracks.length)}
function toggle(){if(has()){au.paused?au.play():au.pause()}else sim.play=!sim.play;render()}

$('pp').onclick=toggle;$('next').onclick=next;$('prev').onclick=prev;
['play','pause','loadedmetadata','timeupdate'].forEach(e=>au.addEventListener(e,render));
au.addEventListener('ended',()=>{if(expRun)return;tracks.length>1?next():(au.currentTime=0,render())});
setInterval(()=>{if(!has()&&sim.play){sim.cur+=.1;if(sim.cur>=sim.dur)sim.cur=0}render()},100);

function drag(el,fn){
 const mv=e=>{const r=el.getBoundingClientRect();fn(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)))};
 el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);mv(e);el.onpointermove=mv});
 const up=()=>el.onpointermove=null;el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}
drag($('pbh'),f=>{const d=dur();if(d)seekTo(f*d)});
drag($('vh'),f=>{vol=f;au.volume=f;$('vf').style.width=f*100+'%';$('vk').style.left=f*100+'%'});

$('art').onclick=$('bImg').onclick=()=>$('imgIn').click();
$('bSong').onclick=()=>$('songIn').click();
$('imgIn').onchange=e=>{const f=e.target.files[0];if(f)setArt(URL.createObjectURL(f));e.target.value=''};
$('songIn').onchange=e=>{
 const first=tracks.length;
 for(const f of e.target.files){
  const n=f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim(),k=n.indexOf(' - ');
  tracks.push({file:f,url:URL.createObjectURL(f),title:k>0?n.slice(k+3):n,artist:k>0?n.slice(0,k):'Unknown Artist'});
 }
 if(tracks.length>first)load(first);e.target.value='';
};
$('iT').oninput=()=>{M().title=$('iT').value;fit()};
$('iA').oninput=()=>{M().artist=$('iA').value;setText()};
$('iD').oninput=setText;
$('gear').onclick=()=>$('panel').classList.toggle('open');
$('x').onclick=()=>$('panel').classList.remove('open');

/* Export video 9:16 */
let expRun=null,ac,adst,again,mc;
const EW=720,EH=1280,EF='Inter,-apple-system,"SF Pro Text",Roboto,"Helvetica Neue",Arial,sans-serif';
const rr=(c,x,y,w,h,r)=>{c.beginPath();c.roundRect(x,y,w,h,r)};
const mk=(w,h)=>{const e=document.createElement('canvas');e.width=w;e.height=h;return e};
const cover=(c,im,x,y,w,h,z=1)=>{const s=Math.max(w/im.naturalWidth,h/im.naturalHeight)*z,iw=im.naturalWidth*s,ih=im.naturalHeight*s;c.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih)};
function fitTxt(c,s,w){if(c.measureText(s).width<=w)return s;while(s.length>1&&c.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…'}
function makeBg(){
  // Mirror the softer, locally blurred wallpaper used by the HTML preview.
  const a=mk(160,285),ax=a.getContext('2d');
  ax.fillStyle='#a3c0df';ax.fillRect(0,0,160,285);
  ax.save();ax.filter='blur(11px) saturate(1.07)';cover(ax,$('artimg'),-23,15,206,206);ax.restore();
  const b=mk(EW,EH),c=b.getContext('2d');c.imageSmoothingQuality='high';c.drawImage(a,0,0,EW,EH);
  const g=c.createLinearGradient(0,0,0,EH);
  g.addColorStop(0,'rgba(220,216,211,.87)');g.addColorStop(.32,'rgba(203,219,234,.12)');
  g.addColorStop(.61,'rgba(145,177,214,.12)');g.addColorStop(1,'rgba(134,168,210,.77)');
  c.fillStyle=g;c.fillRect(0,0,EW,EH);
  c.save();c.translate(0,EH*1.01);c.scale(300,300);const sh=c.createRadialGradient(0,0,0,0,0,1);
  sh.addColorStop(0,'rgba(19,37,64,.70)');sh.addColorStop(.75,'rgba(19,37,64,0)');
  c.fillStyle=sh;c.fillRect(-1,-1,2,2);c.restore();return b;
}
function drawFrame(c,bg,t,d,o){
 c.drawImage(bg,0,0);c.save();c.translate(25,0);c.translate(38,155);
 const cg=c.createLinearGradient(0,0,0,970);
  cg.addColorStop(0,'rgba(115,122,137,.73)');cg.addColorStop(.51,'rgba(87,102,117,.68)');
  cg.addColorStop(1,'rgba(62,78,101,.65)');
  c.shadowColor='rgba(36,52,78,.15)';c.shadowBlur=35;c.shadowOffsetY=10;
  c.fillStyle=cg;rr(c,0,0,595,970,82);c.fill();c.shadowColor='transparent';
  // Dark translucent bloom beneath the album, without darkening the edges.
  c.save();rr(c,0,0,595,970,82);c.clip();
  c.translate(595*.5,970*.71);c.scale(245,190);
  const spot=c.createRadialGradient(0,0,0,0,0,1);
  spot.addColorStop(0,'rgba(7,13,25,.67)');spot.addColorStop(.45,'rgba(7,14,27,.56)');
  spot.addColorStop(.99,'rgba(16,28,45,0)');
  c.fillStyle=spot;c.fillRect(-1,-1,2,2);c.restore();
 c.save();rr(c,0,0,595,970,82);c.clip();c.shadowColor='rgba(255,236,214,.21)';c.shadowBlur=10;c.shadowOffsetY=4;
 c.beginPath();c.rect(-100,-100,800,1200);c.roundRect(0,0,595,970,82);c.fillStyle='#000';c.fill('evenodd');c.restore();
 c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=2;rr(c,1,1,593,968,81);c.stroke();
 c.save();rr(c,40,38,516,519,[38,38,30,30]);c.clip();cover(c,$('artimg'),40,38,516,519);c.restore();
 c.textBaseline='middle';c.fillStyle='rgba(255,255,255,.7)';
 c.font='400 20px '+EF;c.fillText(o.dev,40,586);
 c.font='400 22px '+EF;c.fillText(fitTxt(c,o.artist,440),40,650);
 c.font='600 21px '+EF;const tw=c.measureText(o.title).width,x=mc.getContext('2d');
 x.clearRect(0,0,440,30);x.font=c.font;x.textBaseline='middle';x.fillStyle='#fff';
 if(tw>440){
  const D=tw+70,S=D/42+2,p=(t%S)/S,off=p<.12?0:(p-.12)/.88*D,lf=p<.12?0:p<.18?(p-.12)/.06*30:p<.94?30:(1-p)/.06*30;
  x.fillText(o.title,-off,16);x.fillText(o.title,-off+D,16);x.globalCompositeOperation='destination-in';
  const mg=x.createLinearGradient(0,0,440,0);mg.addColorStop(0,'rgba(0,0,0,0)');mg.addColorStop(lf/440,'#000');mg.addColorStop(1-30/440,'#000');mg.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=mg;x.fillRect(0,0,440,30);x.globalCompositeOperation='source-over';
 }else x.fillText(o.title,0,16);
 c.drawImage(mc,40,601);
 const r=Math.max(0,d-t);c.font='500 18px '+EF;c.fillStyle='rgba(255,255,255,.82)';
 c.fillText(pad(Math.floor(t/60))+':'+pad(Math.floor(t%60)),42,733);c.textAlign='right';
 c.fillText('-'+Math.floor(r/60)+':'+pad(Math.floor(r%60)),552,733);c.textAlign='left';
 c.save();c.translate(507,605);c.globalAlpha=.95;c.strokeStyle=c.fillStyle='#fff';c.lineWidth=2.6;c.lineCap=c.lineJoin='round';
 c.stroke(new Path2D('M7.8 25.2A13 13 0 1 1 26.2 25.2'));c.stroke(new Path2D('M11.3 21.7A8 8 0 1 1 22.7 21.7'));
 const tp=new Path2D('M17 20.5 25 30H9Z');c.fill(tp);c.stroke(tp);c.restore();
 c.fillStyle='rgba(255,255,255,.34)';rr(c,40,703,516,6,3);c.fill();
 const pw=d?Math.min(1,t/d)*516:0;c.fillStyle='#fff';if(pw>0){rr(c,40,703,pw,6,3);c.fill()}
 const ic=(px,py,ps,lw)=>{c.save();c.translate(px,py);c.lineWidth=lw;c.lineJoin='round';ps.forEach(s=>{const q=new Path2D(s);c.fill(q);c.stroke(q)});c.restore()};
 c.strokeStyle=c.fillStyle='#fff';
 ic(116,781,['M4 19 29 5V33Z','M34 19 59 5V33Z'],4);ic(418,781,['M4 5 29 19 4 33Z','M34 5 59 19 34 33Z'],4);
 rr(c,278,771.5,15,57,3.5);c.fill();rr(c,303,771.5,15,57,3.5);c.fill();
 c.globalAlpha=.88;ic(62,878,['M3 11h5l8-6.5v21L8 19H3z'],2);ic(494,877,['M3 11h5l8-6.5v23L8 21H3z'],2);
 c.save();c.translate(494,877);c.lineWidth=2.6;c.lineCap='round';['M22 11.5a7 7 0 0 1 0 9','M27 7.5a12.5 12.5 0 0 1 0 17','M32 3.5a18 18 0 0 1 0 25'].forEach(s=>c.stroke(new Path2D(s)));c.restore();c.globalAlpha=1;
 c.fillStyle='rgba(255,255,255,.34)';rr(c,116,890,353,5,2.5);c.fill();
 c.fillStyle='#fff';if(o.vol>0){rr(c,116,890,o.vol*353,5,2.5);c.fill()}
 c.shadowColor='rgba(0,0,0,.25)';c.shadowBlur=8;c.shadowOffsetY=2;c.beginPath();c.arc(116+o.vol*353,893,21,0,7);c.fill();
 c.restore();
}
async function saveFile(blob,name){
 if(window.claude){const dl=await claude.use('downloads');if(!dl)throw{code:'unavailable'};return dl.save({filename:name,data:blob})}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
async function exportVideo(){
 const st=$('expSt'),btn=$('bExp');
 if(expRun){expRun.cancel();return}
 if(!has()){st.textContent='Import lagu dahulu, kemudian tekan Export video.';return}
 if(!window.MediaRecorder){st.textContent='Pelayar ini tidak menyokong export video.';return}
 const mt=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
 if(!mt){st.textContent='Format video tidak disokong pelayar ini.';return}
 if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaElementSource(au);adst=ac.createMediaStreamDestination();again=ac.createGain();src.connect(adst);src.connect(again);again.connect(ac.destination)}
 const pv=au.volume;let tick,rec,cancelled=false,onEnd;
 try{
  await ac.resume();await document.fonts.load('600 21px Inter');
  const d=dur();if(!d)throw{code:'nodur'};
  const cv=mk(EW,EH),c=cv.getContext('2d'),bg=makeBg();mc=mk(440,30);
  const o={title:M().title,artist:M().artist,dev:$('iD').value||'iPhone',vol};
  const ms=new MediaStream([...cv.captureStream(30).getVideoTracks(),...adst.stream.getAudioTracks()]);
  rec=new MediaRecorder(ms,{mimeType:mt,videoBitsPerSecond:6e6,audioBitsPerSecond:192e3});
  const ch=[],done=new Promise(r=>rec.onstop=r);
  rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  const finish=()=>{clearInterval(tick);if(rec.state!=='inactive')rec.stop()};
  onEnd=async()=>{drawFrame(c,bg,d,d,o);await new Promise(r=>setTimeout(r,250));finish()};
  expRun={cancel(){cancelled=true;au.pause();finish()}};
  au.addEventListener('ended',onEnd);btn.textContent='Batal export';
  au.volume=1;again.gain.value=0;au.pause();au.currentTime=0;
  drawFrame(c,bg,0,d,o);rec.start(1000);await au.play();
  tick=setInterval(()=>{const t=au.currentTime;drawFrame(c,bg,t,d,o);st.textContent='Merakam… '+Math.floor(t/d*100)+'%'},33);
  await done;
  if(cancelled){st.textContent='Export dibatalkan.';return}
  st.textContent='Menyimpan…';const ext=mt.includes('mp4')?'mp4':'webm';
  await saveFile(new Blob(ch,{type:'video/'+ext}),'music-player.'+ext);
  st.textContent='Siap. Video 720×1280 (9:16) disimpan.';
 }catch(e){st.textContent=e&&e.code==='declined'?'Simpan dibatalkan.':e&&e.code==='unavailable'?'Muat turun tidak tersedia di paparan ini.':'Export gagal. Cuba lagi.'}
 finally{clearInterval(tick);if(rec&&rec.state!=='inactive')rec.stop();au.removeEventListener('ended',onEnd);au.pause();au.currentTime=0;au.volume=pv;if(again)again.gain.value=1;expRun=null;btn.textContent='Export video 9:16';render()}
}
const yl=()=>new Promise(r=>{const m=new MessageChannel();m.port1.onmessage=r;m.port2.postMessage(0)});
async function exportMp4(){
 const st=$('expSt'),btn=$('bExp');
 if(expRun){expRun.cancel();return}
 if(!has()){st.textContent='Import lagu dahulu, kemudian tekan Export video.';return}
 const vc={codec:'avc1.640028',width:EW,height:EH,bitrate:6e6,framerate:30},ac2={codec:'mp4a.40.2',numberOfChannels:2,sampleRate:44100,bitrate:192e3};
 let ok=false;
 try{ok=!!(window.Mp4Muxer&&window.VideoEncoder&&window.AudioEncoder&&tracks[ti].file&&(await VideoEncoder.isConfigSupported(vc)).supported&&(await AudioEncoder.isConfigSupported(ac2)).supported)}catch(e){}
 if(!ok)return exportVideo();
 let cancelled=false,err,ve,ae;
 try{
  expRun={cancel(){cancelled=true}};btn.textContent='Batal export';st.textContent='Menyediakan audio…';
  await document.fonts.load('600 21px Inter');
  const actx=new AudioContext({sampleRate:44100}),buf=await actx.decodeAudioData(await tracks[ti].file.arrayBuffer());actx.close();
  const sr=44100,d=buf.duration,n=Math.ceil(d*30);
  const mux=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:EW,height:EH},audio:{codec:'aac',numberOfChannels:2,sampleRate:sr},fastStart:'in-memory'});
  ve=new VideoEncoder({output:(k,m)=>mux.addVideoChunk(k,m),error:e=>err=e});ve.configure(vc);
  ae=new AudioEncoder({output:(k,m)=>mux.addAudioChunk(k,m),error:e=>err=e});ae.configure(ac2);
  const c0=buf.getChannelData(0),c1=buf.numberOfChannels>1?buf.getChannelData(1):c0;
  for(let s=0;s<c0.length&&!err;s+=sr){
   const k=Math.min(sr,c0.length-s),pd=new Float32Array(k*2);pd.set(c0.subarray(s,s+k));pd.set(c1.subarray(s,s+k),k);
   const ad=new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:k,numberOfChannels:2,timestamp:Math.round(s/sr*1e6),data:pd});ae.encode(ad);ad.close();
   while(ae.encodeQueueSize>20)await yl();
  }
  const cv=mk(EW,EH),c=cv.getContext('2d'),bg=makeBg();mc=mk(440,30);
  const o={title:M().title,artist:M().artist,dev:$('iD').value||'iPhone',vol};
  for(let i=0;i<n&&!cancelled&&!err;i++){
   drawFrame(c,bg,Math.min(i/30,d),d,o);
   const vf=new VideoFrame(cv,{timestamp:Math.round(i*1e6/30),duration:Math.round(1e6/30)});
   ve.encode(vf,{keyFrame:i%60===0});vf.close();
   if(i%8===0)st.textContent='Memproses video… '+Math.floor(i/n*100)+'%';
   while(ve.encodeQueueSize>10)await yl();
   if(i%4===0)await yl();
  }
  if(cancelled){st.textContent='Export dibatalkan.';return}
  if(err)throw err;
  st.textContent='Menyiapkan fail…';
  await ve.flush();await ae.flush();mux.finalize();
  await saveFile(new Blob([mux.target.buffer],{type:'video/mp4'}),'music-player.mp4');
  st.textContent='Siap. Video MP4 720×1280 (9:16) disimpan.';
 }catch(e){st.textContent=e&&e.code==='declined'?'Simpan dibatalkan.':e&&e.code==='unavailable'?'Muat turun tidak tersedia di paparan ini.':'Export gagal. Cuba lagi.'}
 finally{try{if(ve&&ve.state!=='closed')ve.close();if(ae&&ae.state!=='closed')ae.close()}catch(x){}expRun=null;btn.textContent='Export video 9:16'}
}
$('bExp').onclick=exportMp4;
